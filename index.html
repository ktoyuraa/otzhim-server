  if(MODE==="gov"&&["start","term_end","reign_end","successor"].includes(g)) window.ym(113832869,"reachGoal","gov_"+g,p||{});

  if(MODE==="olig"&&g==="start") window.ym(113832869,"reachGoal","olig_start",p||{}); }}catch(e){}};
let S=null;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const tt=()=>S.turn-S.termStart;
const termLen=()=>S.vrio?VRIO_LEN:TERM;

const advBy=r=>S.adv.find(a=>a.role===r);

// ----- советники -----
function newAdv(role){S.advNo=S.advNo||{}; S.advNo[role]=(S.advNo[role]||0)+1; return {role,no:S.advNo[role],age:ri(42,62),loy:role==="opp"?ri(30,45):ri(52,68),since:S.turn,cool:0};}
function replaceAdv(role,why,served){
  const old=advBy(role), nw=newAdv(role);
  S.adv[S.adv.indexOf(old)]=nw;
  S.notes.push({role,why,served:served||0,age:nw.age});
}
function advice(e){
  const rec={};
  for(const a of S.adv){const w=ROLES[a.role].w; let best=-1,bs=0.5;
    e.o.forEach((o,i)=>{let s=0; for(const k in w) s+=(o[1][k]||0)*w[k]; if(s>bs){bs=s;best=i}});
    if(best>=0) rec[a.role]=best;}
  return rec;
}

// ----- новая игра, новый правитель, новый срок -----
function snap(){return {...S.m,gdp:S.gdp,debt:S.debt};}
function newRuler(){
  S.ruler={no:(S.ruler?S.ruler.no+1:1),age:ri(44,58),health:ri(84,95),startTurn:S.turn,origin:snap(),goals:[],feats:[]};
  S.term=1; S.forever=false;
}
const poolC=()=>MODE==="gov"?GOV_REGIONS:COUNTRIES;
const poolEV=()=>MODE==="gov"?GOV_EVENTS:EVENTS;
function newGame(){
  if(MODE==="olig"){ oligNew(); return; }
  const C=poolC(), c=C[Math.floor(Math.random()*C.length)];
  const has=t=>c.tags.includes(t);
  const m=MODE==="gov"?{
    p:Math.round(50+(has("poor")?-4:0)+(has("rich")?3:0)+rnd(-5,5)),
    t:Math.round(clamp(70-c.debt*0.5,25,75)),
    e:Math.round(clamp(25+18*Math.log10(c.gdp/0.4),20,78)),
    l:Math.round(50+rnd(-6,6))
  }:{
    p:Math.round(50+(has("fragile")?-12:0)+(has("rich")?5:0)+rnd(-5,5)),
    t:Math.round(clamp(65-c.debt/5+(has("oil")?10:0),15,80)),
    e:Math.round(clamp(25+18*Math.log10(c.gdp/0.4),20,78)),
    l:Math.round(50+(has("fragile")?-10:0)+rnd(-5,5))
  };
  S={c,m,gdp:c.gdp,debt:c.debt,turn:0,queue:[],usedAt:{},genSeen:[],healthSeen:[],log:[],ev:null,last:null,notes:[],
     crisis:null,lastCrisis:0,crisisSeen:[],rulers:[],adv:[],reactAt:{},goalEvTerm:0,mode:MODE,phase:"roll"};
  newRuler(); fpInit();
  S.adv=["fin","gen","soc","opp"].map(newAdv);
  if(MODE==="gov") govInit();
  beginTerm(); S.phase="roll";
  track("start",{country:S.c.n,lang:LANG,mode:MODE});
  render();
}
function beginTerm(){
  S.termStart=S.turn; S.start=snap(); S.builds=0; S.last=null; S.why=null; S.fpUI=null;
  if(MODE!=="gov"&&S.term>=2&&!advBy("dip")){ S.adv.push(newAdv("dip")); S.notes.push({k:"fpNew"}); }
  const pool=GOALS.filter(g=>!g.av||g.av()).sort(()=>Math.random()-.5);
  S.offer=S.vrio?["vrio"]:pool.slice(0,3).map(g=>g.id); S.goal=null; S.phase="goal";
  if(MODE==="gov") govBeginTerm();
}
function setGoal(id){S.notes=[]; S.goal=id; S.phase="play"; if(MODE==="gov") assignPlan(); S.ev=pick(); render();}

// ----- выбор следующей карточки -----
function eligible(e){ if(e.succ&&S.ruler.no<2) return false; if(e.bio&&e.bio!==S.ruler.bio) return false; if(e.minT&&S.term<e.minT) return false; if(e.y&&year()<e.y) return false; return !e.tag||e.tag==="era"||e.tag==="dilemma"||e.tag===S.c.n||S.c.tags.includes(e.tag)||(e.tag==="forever"&&S.forever);}
function pick(){ const e=pickRaw(); S.recs=advice(e); return e; }
function genEvent(){
  const ids=Object.keys(GEN).filter(g=>MODE==="gov"?["reg","dis","cmp"].concat(NEIGH[S.c.n]?["nbr"]:[]).includes(g):!["cmp","nbr"].includes(g));
  for(let i=0;i<20;i++){const gid=ids[Math.floor(Math.random()*ids.length)], e=GEN[gid](); if(!S.genSeen.includes(e.key)){S.genSeen.push(e.key); return {...e,gid,tag:"gen"};}}
  return {...GEN.reg(),gid:"reg",tag:"gen"};
}
function pickRaw(){
  if(S.crisis){const C=CRISES[S.crisis.id],st=C.steps[S.crisis.step]; return {tag:"crisis",h:st[0],x:st[1],o:st[2]};}
  const EL=MODE==="gov"?GOV_ELECTION:ELECTION;
  if(S.handover&&S.handover.length) return S.handover.shift();
  if(MODE==="gov"&&hasElection()&&tt()>=termLen()-4&&(S.campStep||0)<4) return campCard(S.campStep||0);
  if(MODE==="gov"&&S.bigc&&S.bigc.st<5&&tt()>=[1,3,5,8,10][S.bigc.st]) return GOV_FN.bc(S.bigc.st);
  if(MODE==="gov"){ const ge=govScheduled(); if(ge) return ge; }
  if(MODE!=="gov"&&hasElection()&&tt()===termLen()-4) return EL[0];
  if(MODE!=="gov"&&hasElection()&&tt()===termLen()-2) return EL[1+Math.floor(Math.random()*2)];
  fpInit(); { const fe=fpEvent(); if(fe) return fe; }
  const angry=MODE==="gov"?null:S.adv.find(a=>a.loy<=25&&a.cool<=S.turn);
  if(angry){angry.cool=S.turn+8; const E=(MODE==="gov"&&ADV_EV_GOV[angry.role])||ADV_EV[angry.role]; return {tag:"team",h:E[0],x:E[1],o:E[2]};}
  const due=S.queue.findIndex(q=>q.at<=S.turn&&!(q.fn&&OPTQ.includes(q.fn)&&Math.random()<0.5));
  if(due>=0){const q=S.queue.splice(due,1)[0]; return q.fn?GOV_FN[q.fn](q.a):{...FOLLOW[q.key],from:q.from};}
  if(S.turn-S.lastCrisis>=24&&tt()>=2&&tt()<=8&&Math.random()<0.2){
    const okC=k=>MODE==="gov"?k.startsWith("g_"):!k.startsWith("g_");
    let ids=Object.keys(CRISES).filter(k=>okC(k)&&!S.crisisSeen.includes(k)); if(!ids.length){S.crisisSeen=[];ids=Object.keys(CRISES).filter(okC);}
    const id=ids[Math.floor(Math.random()*ids.length)]; S.crisisSeen.push(id);
    S.crisis={id,step:0,score:0}; return pickRaw();
  }
  const R=S.ruler;
  if((R.age>=60&&Math.random()<0.1)||(R.health<40&&Math.random()<0.2)){
    const ok=(MODE==="gov"?GOV_HEALTH:HEALTH).filter(h=>(!h.cond||(h.cond==="weak"&&R.health<45)||(h.cond==="old"&&R.age>=70)));
    let fresh=ok.filter(h=>!S.healthSeen.includes(h.h)); if(!fresh.length){S.healthSeen=[];fresh=ok;}
    const h=fresh[Math.floor(Math.random()*fresh.length)]; S.healthSeen.push(h.h); return h;
  }
  // событие по цели срока: одно за срок, в середине срока
  const GE=S.goal&&(MODE==="gov"?GOV_GOALEV[S.goal]:GOALEV[S.goal]);
  if(GE&&S.goalEvTerm!==S.term&&tt()>=3&&tt()<=10&&Math.random()<0.22){S.goalEvTerm=S.term;return GE;}
  // событие по состоянию страны: не чаще раза в 4 года на каждое
  S.reactAt=S.reactAt||{};
  const rs=REACT.filter(r=>(MODE==="gov"?GOV_REACT_KEYS.includes(r.key):!r.key.startsWith("g_"))&&!(S.reactAt[r.key]>S.turn-16)&&REACT_COND[r.key]());
  if(rs.length&&Math.random()<0.35){const r=rs[Math.floor(Math.random()*rs.length)];S.reactAt[r.key]=S.turn;return r;}
  const EVP=poolEV(); const fresh=EVP.some((e,i)=>eligible(e)&&S.usedAt[i]===undefined);
  if(Math.random()<(fresh?0.3:0.75)) return genEvent();
  const all=EVP.map((e,i)=>({e,i})).filter(({e})=>eligible(e));
  const ago=i=>S.usedAt[i]===undefined?1e9:S.turn-S.usedAt[i];
  let pool=all.filter(x=>S.usedAt[x.i]===undefined);
  if(!pool.length) pool=all.sort((a,b)=>ago(b.i)-ago(a.i)).slice(0,6);
  const w=pool.map(x=>MODE==="gov"&&x.e.tag===S.c.n?6:x.e.tag&&!["forever","dilemma"].includes(x.e.tag)?2.2:1); let r=Math.random()*w.reduce((a,b)=>a+b,0);
  let x=pool[pool.length-1];
  for(let k=0;k<pool.length;k++){r-=w[k]; if(r<=0){x=pool[k];break}}
  S.usedAt[x.i]=S.turn; return (MODE==="gov"&&x.e.loc&&S.dist)?{...x.e,dist:pickOne(S.dist).n}:x.e;
}

// ----- ход -----
function choose(k){
  const ev=S.ev,o=ev.o[k],eff=o[1],frag=S.c.tags.includes("fragile");
  const before={...S.m}; S.notes=[];
  for(const [key] of M){ let v=eff[key]||0; if(v<0&&frag) v=Math.round(v*1.25); if(v>0&&(key==="p"||key==="t"||(MODE==="gov"&&key==="e"))) v=Math.round(v*(S.m[key]>=84?0.45:S.m[key]>=72?0.7:1)); /* у потолка рост даётся труднее */ if(MODE==="gov"&&key==="p"&&v>0&&S.term>=3) v=Math.round(v*Math.max(0.6,1-0.07*(S.term-2))); /* усталость от долгого правления */ if(v<0&&S.term>3) v=Math.round(v*Math.min(1.5,1+0.06*(S.term-3))); S.m[key]+=v; }
  if(eff._h) S.ruler.health=clamp(S.ruler.health+eff._h,0,100);
  if(eff._loy) for(const r in eff._loy){const a=advBy(r); a.loy=clamp(a.loy+eff._loy[r],0,100);}
  if(eff._rep) replaceAdv(eff._rep,eff._rep==="opp"?"arrest":"fired");
  if((eff.t||0)<=-9&&((eff.e||0)>0||(eff.p||0)>0)) S.builds++;
  for(const a of S.adv){ if(eff._rep===a.role) continue; const r=S.recs?.[a.role]; const w=ROLES[a.role].w;
    let s=0; for(const key in w) s+=(eff[key]||0)*w[key];
    a.loy=clamp(a.loy+(r===k?3:s<-4?-4:r!==undefined?-3:0),0,100);
    const base=a.role==="opp"?40:58; if(S.turn%4===0&&a.loy!==base) a.loy+=a.loy<base?1:-1; }
  S.m.t+=Math.round((S.m.e-50)/14)-(S.debt>100?2:0);
  S.m.p+=Math.round((S.m.e-50)/22);
  if(S.m.t<20) S.m.e-=2;
  if(S.m.t>=86) S.m.t-=2; else if(S.m.t>=76) S.m.t-=1; // полная казна: все просят потратить
  if(S.m.p>=86) S.m.p-=2; else if(S.m.p>=78) S.m.p-=1; // ожидания растут
  if(MODE==="gov"&&S.m.e>=80) S.m.e-=1;
  if(advBy("opp").loy<10) S.m.p-=1;
  for(const [key] of M) S.m[key]=clamp(Math.round(S.m[key]),0,100);
  const growth=(S.m.e-50)/25-Math.max(0,Math.log10(S.gdp/10))*0.35+rnd(-.4,.4);
  S.gdp*=1+growth/100;
  S.debt=clamp(S.debt+(before.t-S.m.t)*0.6+(50-S.m.t)/40,0,400);
  if(o[3]) S.queue.push({at:S.turn+o[3][0],key:o[3][1],from:{a:o[0],h:ev.h,turn:S.turn}});
  if(ev.next&&!(ev.key==="olymp2"&&k===2)) S.queue.push({at:S.turn+ev.next[0],key:ev.next[1],from:{a:o[0],h:ev.h,turn:S.turn}});
  if(MODE==="gov"){ govAfterChoose(ev,eff); govMoscowAfter(eff); lifeAfter(ev,eff,k); mapAfter(ev,eff,k); campAfter(ev,eff); if(S.doTransfer){S.doTransfer=false; transfer(); return;} }
  const lite=ev.gid?{gid:ev.gid,p:ev.p}:ev.fpe?{fpe:ev.fpe,c:ev.c}:{h:ev.h};
  if(ev.fpe){ if(eff._rel) fpRelAdd(ev.c,eff._rel); if(eff._unally) S.allies=S.allies.filter(x=>x!==ev.c); }
  S.log.push({ev:lite,a:o[0],r:o[2],f:!!ev.from,q:S.turn,tag:ev.tag||"",m:["p","t","e","l"].reduce((a,k)=>a+Math.abs(eff[k]||0),0)});
  S.last={ev:lite,a:o[0],r:o[2],cr:null};
  if(ev.tag==="crisis"){
    S.crisis.score+=eff._cs||0; S.crisis.step++;
    if(S.crisis.step>=4){
      const C=CRISES[S.crisis.id], sc=S.crisis.score+(S.allies&&S.allies.length?1:0);
      if(S.allies&&S.allies.length) S.notes.push({k:"fpAllyHelp",a:[S.allies]});
      if(sc>=3){S.m.p=clamp(S.m.p+6,0,100); S.ruler.feats.push({n:C.win,c:C.n,good:true}); S.last.cr={res:"win",n:C.win};}
      else if(sc<=0){S.m.p=clamp(S.m.p-6,1,100); S.m.e=clamp(S.m.e-4,1,100); S.ruler.feats.push({n:C.lose,c:C.n,good:false}); S.last.cr={res:"lose"};}
      else S.last.cr={res:"mid"};
      S.crisis=null; S.lastCrisis=S.turn;
    }
  }
  S.turn++;
  fpResolve();
  const R=S.ruler;
  if((S.turn-R.startTurn)%4===0){
    R.age++;
    if(S.allies&&S.allies.length) S.m.e=clamp(S.m.e+1,1,CAP-1); // торговля с союзниками
    R.health=clamp(R.health-(R.age<60?ri(0,2):R.age<70?ri(1,3):R.age<80?ri(2,5):ri(3,7)),0,100);
    for(const a of S.adv){a.age++; const served=Math.round((S.turn-a.since)/4);
      if(a.role!=="opp"&&(a.age>=71||(served>=6&&Math.random()<0.15))) replaceAdv(a.role,"retire",served);
      else if(a.role==="opp"&&(a.age>=75||(served>=8&&Math.random()<0.12))) replaceAdv("opp","leave",served);}
  }
  const q=0.0006*Math.pow(1.11,Math.max(0,R.age-55))*Math.max(0.5,1+(60-R.health)/40);
  const dead=M.find(([key])=>S.m[key]<=0);
  if(eff._retire){S.phase="end";S.why="retire";}
  else if(eff._arrest){S.phase="end";S.why="arrest";}
  else if(eff._end){S.phase="end";S.why=eff._end;}
  else if(R.health<=0||Math.random()<q){S.phase="end";S.why="death";}
  else if(dead){S.phase="end";S.why=dead[0];}
  else if(eff._mskEnd){S.phase="end";S.why="L";}
  else if(MODE==="gov"&&S.m.l>=CAP&&!M.some(([key])=>key!=="l"&&S.m[key]>=CAP)){ S.m.l=CAP-5; if(!S.moscowPending&&!S.mskArc){S.moscowPending=true; S.handover=[GOV_FN.moscowCall(),...(S.handover||[])];} S.ev=pick(); }
  else if(M.some(([key])=>S.m[key]>=CAP)){S.phase="end";S.why=OVER[M.find(([key])=>S.m[key]>=CAP)[0]];}
  else if(tt()>=termLen()&&!S.mskArc&&!S.moscowPending){S.phase="end";S.why="term"; termResult();}
  else S.ev=pick();
  if(S.phase==="end"&&S.why==="term") track("term_end",{country:S.c.n,term:S.term});
  render();
}
function termResult(){
  const G=goalObj(), ok=G.ok();
  S.goalOk=ok; S.lastVote=hasElection()?vote():null;      // голоса считаются до награды/штрафа
  S.ruler.goals.push({n:G.n,ok});
  const eff=ok?G.win:GOAL_FAIL; S.goalEff=eff;
  for(const k in eff) S.m[k]=clamp(S.m[k]+eff[k],5,CAP-3);  // награда не может сразу вызвать финал
  if(MODE==="gov") planResult();
}
const effStr=eff=>Object.entries(eff).map(([k,v])=>tr(M.find(x=>x[0]===k)[1])+" "+(v>0?"+":"−")+Math.abs(v)).join(" · ");
function vote(){
  const g=(S.gdp/S.start.gdp-1)*100, G=goalObj();
  return clamp(54-4*(S.term-1)+0.5*(S.m.p-50)+0.4*(S.m.p-S.start.p)+0.25*(S.m.e-S.start.e)+1.5*clamp(g,-15,6)+(G?(G.ok()?6:-6):0)+(advBy("opp").loy-50)*0.06+(MODE==="gov"?(S.dist?(distAvg()-S.m.p)*0.3:0)-3-(S.m.l<35?6:0)-(S.term>=3?2:0)-Math.max(0,S.term-3)*1.5-(S.rotDefy||0)*3+(S.mayorVote||0)+(S.campaign||0):0),5,95);
}

function dossierHTML(){
  const c=S.c, dg=(S.gdp/S.start.gdp-1)*100, dd=S.debt-S.start.debt, R=S.ruler;
  return `<div class="dossier"><span class="stamp">${tr(c.tags.includes("fragile")?"Высокий риск":c.tags.includes("rich")?"Стабильно":"Под контролем")}</span>
  <div class="who"><div class="label">${R.no>1?u("rulerNo",R.no):u("you")} · ${tr(c.r)}</div><h2>${tr(c.n)}</h2><div class="label" style="margin-top:6px">${c.tags.map(t=>TAGNAMES[t]).filter(Boolean).map(tr).join(" · ")||tr("обычная страна")}</div></div>
  <div class="facts">
   <div><span>${u("fRuler")}</span><b>${u("age",R.age)}</b> <span class="delta ${R.health<35?"down":""}" style="display:inline">${u("health",healthWord(R.health))}</span></div>

function legacy(){
  const R=S.ruler, O=R.origin, g=(S.gdp/O.gdp-1)*100, y=(S.turn-R.startTurn)/4;
  const forced=!["term","retire","death","legend","honor"].includes(S.why)&&!(MODE==="gov"&&S.why==="L");
  const gd=R.goals.filter(x=>x.ok).length, gf=R.goals.length-gd;
  const fg=R.feats.filter(f=>f.good).length, fb=R.feats.length-fg;
  const score=clamp(g,-40,60)*1.2+(S.m.p-50)*0.5-clamp((S.debt-O.debt)*0.2,-10,15)+Math.min(y,24)*1.5+gd*5-gf*2+fg*8-fb*8-(forced?15:0)-(S.forever?8:0)+(MODE==="gov"&&S.why==="L"?10:0)+(S.why==="legend"?20:S.why==="honor"?8:0);
  const t=TITLES[score>=55?0:score>=35?1:score>=15?2:score>=0?3:score>=-15?4:5];
  return {t,score,g,y,gd};
}

function successor(){

function fpResolve(){
  if(!S.fp||S.turn<S.fp.at) return;
  const {id,c}=S.fp, A=FPA[id]; S.fp=null;
  const res=A.run(c);
  for(const k in res.eff) S.m[k]=clamp(S.m[k]+res.eff[k],1,CAP-1);
  fpRelAdd(c,res.rel);
  const txt=res.r==="ok"?A.ok:A.fail;
  S.notes.push({k:"fpRes",a:[c,txt]}); if(res.caught) S.notes.push({k:"fpCaught"});
  S.log.push({ev:{fp:1,c},a:A.n,r:res.caught?"Операцию раскрыли — международный скандал.":txt,q:S.turn,tag:"fp",m:Object.values(res.eff).reduce((a,v)=>a+Math.abs(v),0)+(res.caught?6:0)});
}

function fpEvent(){

    return {tag:"fp",fpe:"ally",c,o:[["Отправить помощь",{t:-6,_rel:10},"Союзник благодарен."],["Отказать союзнику",{l:-2,_unally:1,_rel:-30},"Союз распался."]]}; }
  const foes=Object.keys(S.rel).filter(c=>S.rel[c]<=-50&&c!==S.c.n);
  if(foes.length&&Math.random()<0.06){ S.fpReqAt=S.turn; const c=foes[Math.floor(Math.random()*foes.length)];
    return {tag:"fp",fpe:"host",c,o:[["Ответить тем же",{e:-2,l:2,_rel:-10},"Торговая война набирает обороты."],["Пойти на уступки",{e:-1,p:-2,_rel:15},"Пошлины отменили, но уступку заметили."]]}; }

function fpHTML(){

  const reason=r=>!r?"":Array.isArray(r)?u(r[0],r[1]):u(r);
  const acts=FP_GROUPS.map(([g,ids])=>{
    const rows=ids.filter(id=>!(FPA[id].hide&&FPA[id].hide(sel))).map(id=>{const A=FPA[id],why=busy?u("fpBusyNo"):reason(A.can(sel));

   <label class="fpsel"><span class="label">${u("fpCountry")}</span>
    <select id="fpc">${others.map(n=>`<option value="${n}" ${n===sel?"selected":""}>${tr(n)}${fpAlly(n)?" ★":""} · ${fpRel(n)>0?"+":""}${fpRel(n)}</option>`).join("")}</select></label>
   <div class="fpstat"><span class="label">${u("fpRel")}</span><div class="relbar"><i style="left:${rel<0?50+rel/2:50}%;width:${Math.abs(rel)/2}%;background:${rel<0?"var(--bad)":"var(--good)"}"></i></div><b>${rel>0?"+":""}${rel}</b>${tags.map(t=>`<span class="chip">${t}</span>`).join("")}</div>
   ${acts}

  </div>`;

function govNewRuler(){
  const keys=Object.keys(BIO); S.ruler.bio=pickOne(keys);
  for(const k in BIO[S.ruler.bio].m) S.m[k]=clamp(S.m[k]+BIO[S.ruler.bio].m[k],10,85);
  S.charUsed=S.charUsed||[]; let free=Object.keys(CHARS).filter(k=>!S.charUsed.includes(k)); if(!free.length){S.charUsed=[];free=Object.keys(CHARS);}
  const ck=pickOne(free); S.charUsed.push(ck); S.chars={[ck]:{st:0,g:null}};
  S.caseRisk=0; S.vice=null; S.viceSt=0; S.viceG=null;
  famInit();
}
function govInit(){
  const L=[...(GOV_DIST[S.c.n]||GDIST)].sort(()=>Math.random()-.5).slice(0,6);
  S.dist=L.map(n=>({n,m:Math.round(clamp(S.m.p+rnd(-14,14),20,80))}));
  S.npc={j:0,pr:0,ol:0}; govNewRuler(); S.mayor=50; qPush(0,"viceChoose"); S.handover=[GOV_FN.ambChoose()];
}
function govSuccessor(){
  for(const d of S.dist||[]) d.m=Math.round(50+(d.m-50)*0.5);
  S.queue=S.queue.filter(q=>!["vice","viceChoose","case1","case2","case3","bc"].includes(q.fn)); S.bigc=null; S.epi=null; S.epiDone=false;
  govNewRuler(); qPush(3,"viceChoose"); qPush(5,"ambChoose"); S.rotDefy=0;
}

// --- После каждого решения ---
function govAfterChoose(ev,eff){
  const dp=eff.p||0, tgt=(ev.p&&(ev.p.r||ev.p.d))||ev.dist;
  for(const d of S.dist||[]) d.m=Math.round(clamp(d.m+dp*0.5+(d.n===tgt?dp*2.5+(dp>0?3:-3):0)+rnd(-1.2,1.2),0,100));
  if(eff._v) S.visitPrep=eff._v;
  if(ev.chr&&S.chars){const C=S.chars[ev.chr]; if(C.st===0) C.g=!!eff._g; C.st++;}
  S.termMinP=Math.min(S.termMinP??100,S.m.p);
  govStoryAfter(ev,eff);
  lateAfter(ev,eff);
}

  if(T===3&&S.vrio) return minfinEv();
  if(!S.vrio&&T===5&&S.bigEv){ const vis=S.bigEv==="visit"; S.chain=vis?VISIT.slice(1):receptionChain(); return vis?VISIT[0]():S.chain.shift(); }
  if(S.vrio?T===7:(T===4||T===8||T===13)){ const EVP=poolEV(); const idx=EVP.map((e,i)=>i).filter(i=>EVP[i].tag===S.c.n&&eligible(EVP[i])&&S.usedAt[i]===undefined);
    const gen=idx.length?idx:EVP.map((e,i)=>i).filter(i=>!EVP[i].tag&&eligible(EVP[i])&&S.usedAt[i]===undefined);
    if(gen.length){ const i=pickOne(gen); S.usedAt[i]=S.turn; const e=EVP[i]; return (e.loc&&S.dist)?{...e,dist:pickOne(S.dist).n}:e; } }
  if(S.queue.some(q=>q.at<=S.turn)) return null;
  if(S.vrio?T===5:(T===2||T===10)){ const c=charNext(); if(c) return c; }
  return null;
}

GOV_FN.progCheck=()=>{const P=S.prog; if(!P) return GOV_FN.filler(); const n=PROGS[P.id].n;

GOV_FN.progDone=()=>{const P=S.prog; if(!P) return GOV_FN.filler(); const D=PROGS[P.id], bad=(P.q||0)<0;
  const f={}; for(const k in D.fin) f[k]=bad?Math.round(D.fin[k]/2):D.fin[k];
  return SC("prog",bad?`«${D.n}»: закончили, но с недоделками`:`Программа «${D.n}» завершена`,bad?"Программу закрыли, но жители помнят брак и задержки.":"Программа выполнена. Можно отчитаться перед жителями.",[["Большое открытие",{...f,p:(f.p||0)+1,t:(f.t||0)-1,_pfin:1},"Праздник по всему региону."],["Без церемоний",{...f,_pfin:1},"Тихо и по делу."]]);};

// ---------- Карьера: перевод в другой регион ----------
function promoTarget(){
  const bigger=GOV_REGIONS.filter(r=>r.n!==S.c.n&&r.n!=="Москва"&&r.pop>=S.c.pop*1.2);
  const same=bigger.filter(r=>r.r===S.c.r);
  const L=(same.length?[...same]:[...bigger]).sort((a,b)=>a.pop-b.pop).slice(0,same.length?2:3); return L.length?pickOne(L).n:null;
}
function transferOk(){ return MODE==="gov"&&!S.vrio&&S.term>=2&&S.m.l>=65&&S.goalOk===true&&S.planOk===true; }
function transferNote(){
  if(!transferOk()) return "";
  if(S.offerTerm!==S.term){S.offerTerm=S.term; S.offerReg=promoTarget();}
  if(!S.offerReg) return "";
  const c=GOV_REGIONS.find(r=>r.n===S.offerReg);
  return `<div class="goalbar plan ok"><span class="label">Предложение Москвы</span><b>Возглавить: ${c.n}</b><span class="gd" style="flex-basis:100%">Вы выполнили и обещание жителям, и план Москвы, а отношения с Москвой — ${S.m.l}. Вам предлагают регион крупнее: ${fmtPop(c.pop)} жителей против ${fmtPop(S.c.pop)} у вас${c.r===S.c.r?", в том же округе":""}. Там вы начнёте врио, а через два года — выборы.</span></div>`;
}
function transferBtn(){
  if(!transferOk()||!S.offerReg) return "";
  return `<button class="btn ghost" id="transfer">Принять перевод: ${S.offerReg}</button>`;
}
function transfer(){
  const c=GOV_REGIONS.find(r=>r.n===S.offerReg); if(!c) return;
  track("gov_transfer",{from:S.c.n,to:c.n});
  S.ruler.feats.push({n:`Переведён: ${S.c.n} → ${c.n}`,good:true});
  const has=t=>c.tags.includes(t);
  S.c=c; S.gdp=c.gdp; S.debt=c.debt;
  S.m={p:Math.round(48+(has("poor")?-4:0)+rnd(-5,5)),t:Math.round(clamp(70-c.debt*0.5,25,75)),e:Math.round(clamp(25+18*Math.log10(c.gdp/0.4),20,78)),l:Math.round(clamp(S.m.l,50,70))};
  S.mapMarks={}; S.queue=[]; S.usedAt={}; S.genSeen=[]; S.crisis=null; S.chain=null; S.prog=null; S.mega=null; S.reactAt={};
  const L=[...(GOV_DIST[c.n]||GDIST)].sort(()=>Math.random()-.5).slice(0,6); S.dist=L.map(n=>({n,m:Math.round(clamp(S.m.p+rnd(-14,14),20,80))}));
  S.mayor=50; S.npc={j:0,pr:0,ol:0}; chron("Переведён: врио губернатора — "+c.n); S.ruler.origin=snap(); S.ruler.ambGdp=c.gdp; S.rotDefy=0; S.rank=null;
  S.handover=[HO("Новый регион","Вы приехали в незнакомый регион. Местные элиты настороженно смотрят на «варяга».",[["Привезти своих людей",{l:2,p:-2},"Своя команда, чужой регион."],["Опираться на местных",{p:2,l:-1},"Местные оценили."]])];
  S.vrio=true; S.lastVote=null; S.goalEff=null; S.term++; beginTerm(); render(); scrollTo({top:0});
}

GOV_FN.filler=()=>{const e=genEvent(); return e;};
function govBeginTerm(){
  S.mayorVote=0; S.mayor=S.mayor??50;
  S.theme=S.vrio?null:pickOne(Object.keys(THEMES));
  if(S.theme&&Math.random()<0.6){ qPush(3+ri(0,6),"theme",ri(0,2)); }
  if(!S.vrio&&S.term%2===1&&(S.term===1||Math.random()<0.5)){ qPush(2,"mayor1"); qPush(10,"mayor3"); }
  lateBeginTerm();
  qPush(S.vrio?2+ri(0,4):4+ri(0,7),"scheme");
  lifeBeginTerm();
  if(!S.vrio&&!S.ruler.megaOffered&&!S.mega){ S.ruler.megaOffered=true; qPush(5,"megaOffer"); }
  S.campStep=0; S.rival=null; bigBeginTerm();
}
function govStoryAfter(ev,eff){
  if(eff._vice){ S.vice=eff._vice; S.viceG=null; S.viceSt=0; qPush(5,"vice",0); }
  if(ev.tag==="vicestory"&&eff._vs!=null){ S.viceG=!!eff._vs; S.viceSt=(S.viceSt||0)+1; if(S.viceSt<3) qPush(7,"vice",S.viceSt); }
  if(eff._pslow&&S.prog) S.prog.slow=true;
  if(eff._pc&&S.prog) S.prog.c=eff._pc;
  if(eff._pback&&S.prog) S.prog.p=Math.max(0,S.prog.p-eff._pback);
  if(eff._pq&&S.prog) S.prog.q=(S.prog.q||0)+eff._pq;
  if(eff._pfin&&S.prog){ const D=PROGS[S.prog.id]; S.progDone=(S.progDone||[]).concat(S.prog.id); S.ruler.feats.push({n:D.feat,good:(S.prog.q||0)>=0}); track("gov_program_done",{prog:S.prog.id}); S.prog=null; }
  if(eff._case) S.caseRisk=(S.caseRisk||0)+eff._case;
  if(eff._q) for(const [d,fn,a] of eff._q) qPush(d,fn,a);
  if(eff._loot){ S.ruler.loot=(S.ruler.loot||0)+1; S.ruler.feats.push({n:ev.h,good:false}); }
  if(eff._mega&&!S.mega){ S.mega={type:eff._mega,q:0}; qPush(1,"megaContr"); }
  if(eff._mc&&S.mega){ S.mega.c=eff._mc; if(eff._mc==="kin") S.caseRisk=(S.caseRisk||0)+1; qPush(6,"megaStage",1); }
  if(eff._mq&&S.mega) S.mega.q+=eff._mq;
  if(eff._ms&&S.mega){ if(eff._ms===1) qPush(8,"megaStage",2); else qPush(6,"megaOpen"); }
  if(eff._mfin!=null&&S.mega){ S.ruler.feats.push({n:MEGA[S.mega.type].f,good:!!eff._mfin}); S.mega=null; }
  if(eff._mayor) S.mayor=clamp((S.mayor??50)+eff._mayor,0,100);
  if(eff._mv) S.mayorVote=(S.mayorVote||0)+eff._mv;
  if(ev.tag==="case"&&ev.h==="Задержан ваш заместитель") qPush(4,"case2");
  if(ev.tag==="case"&&ev.h==="Следствие расширяется") qPush(4,"case3");
  // запуск уголовного дела: раз за правление, чаще при рисковых решениях
  if(!S.ruler.caseDone&&!S.vrio&&tt()>=4&&Math.random()<0.006+0.012*Math.max(0,S.caseRisk||0)){ S.ruler.caseDone=true; qPush(1,"case1"); }
  // «год без денег»
  if(S.theme==="money"&&tt()%4===3) S.m.t-=3;
  progTick();
}

// ---------- Рейтинг губернаторов (раз в год) ----------
function rankScore(){ return 0.3*S.m.p+0.2*S.m.t+0.25*S.m.e+0.25*S.m.l+(S.dist?(distAvg()-50)*0.2:0)+Math.min(8,(S.ruler.feats||[]).filter(f=>f.good).length*1.5); }
function rankCompute(){
  const s=rankScore(); const r=Math.round(clamp(88-(s-22)*1.55+rnd(-3,3),1,85));
  S.rankPrev=S.rank??null; S.rank=r; S.ruler.bestRank=Math.min(S.ruler.bestRank??99,r);
  const d=S.rankPrev!=null?S.rankPrev-r:0;
  S.notes.push({k:"rankNote",a:[String(r),d>0?`↑ на ${d}`:d<0?`↓ на ${-d}`:"без изменений"]});
  if(r<=10) S.m.l=clamp(S.m.l+2,1,CAP-1);
  if(r<=10&&!S.ruler.top10){S.ruler.top10=1; chron("Регион вошёл в десятку рейтинга губернаторов");}
  if(r>=76) S.m.l=clamp(S.m.l-3,1,CAP-1);
}

function lateBeginTerm(){
  // эпоха: новая каждые 2 срока
  if(!S.era||S.term%2===1){ const prev=S.era; const keys=Object.keys(ERAS).filter(k=>k!==prev); S.era=S.term===1&&!S.eraSet?"calm":pickOne(keys); S.eraSet=true;
    if(ERA_EV[S.era]&&!S.vrio&&Math.random()<0.6){ qPush(1+ri(0,8),"era",0); } }
  // ротация с 3-го срока
  if(!S.vrio&&S.term>=3) qPush(1,"rot");
  if(!S.vrio&&(S.rotDefy||0)>0) for(let i=0;i<Math.min(2,S.rotDefy);i++) S.queue.push({at:S.turn+4+i*5,fn:"rotp",a:i});
}
GOV_FN.rotp=i=>ROT_PRESS[(i+(S.term||0))%ROT_PRESS.length];
function lateAfter(ev,eff){
  if(eff._amb){ S.ruler.amb=eff._amb; S.ruler.ambGdp=S.gdp; S.ruler.ambDone=false; S.calmQ=0; }
  if(eff._rot) S.rotDefy=(S.rotDefy||0)+1;
  S.calmQ=S.m.p>=45?(S.calmQ||0)+1:0;
  if(S.era&&ERAS[S.era].yr&&tt()%4===0) for(const k in ERAS[S.era].yr) S.m[k]=clamp(S.m[k]+ERAS[S.era].yr[k],1,CAP-1);
  if(S.era==="demo"&&S.dist) for(const d of S.dist) d.m=Math.max(0,d.m-0.3);
  if(tt()%4===3) rankCompute();
  const A=AMB[S.ruler.amb];
  if(A&&!S.ruler.ambDone&&A.ok()){ S.ruler.ambDone=true; S.ruler.feats.push({n:`Мечта: ${A.n}`,good:true}); track("gov_legend_ready",{amb:S.ruler.amb}); S.handover=[GOV_FN.ambDone(),...(S.handover||[])]; }
}

function lifeBind(){

    cashAdd(-A.cost); A.run(); S.lfUsed=S.lfUsed||{}; (S.lfUsed[S.term]=S.lfUsed[S.term]||[]).push(k); track("gov_life",{act:k}); S.lfUI=null; render(); scrollTo({top:0}); });

function newsTick(){
  if(S.newsQ&&S.newsQ.length){ S.news=S.newsQ.shift(); return; }
  if(S.turn%3) return;
  const low=S.dist&&[...S.dist].sort((a,b)=>a.m-b.m)[0], hi=S.dist&&[...S.dist].sort((a,b)=>b.m-a.m)[0];

  const opts=[];
  if(low&&low.m<35) opts.push(`${low.n}: жители недовольны властью — настроение ${Math.round(low.m)}`);
  if(hi&&hi.m>70) opts.push(`${hi.n} поддерживает губернатора — настроение ${Math.round(hi.m)}`);
  if(old.length){ const l=pickOne(old); opts.push(`${Math.round((S.turn-l.q)/4)||1} г. назад: «${tr(l.ev.h)}» — вы выбрали «${l.a}». В районах это помнят.`); }

}

  if(eff._divorce){ S.ruler.cash=Math.round((S.ruler.cash||0)/2); if(S.fam) S.fam.wife=null; chron("Развод"); }
  if(eff._pfin) chron(`Завершена программа`);

}

function oHod(n){ const a=n%10,b=n%100; return a===1&&b!==11?"ход":a>=2&&a<=4&&(b<12||b>14)?"хода":"ходов"; }

  if(how==="via"){ price=oViaPrice(id); if(price==null) return; S.m.h+=S.lvl>=2?7:4; }
  if(how==="take"){ price=0; S.m.h+=10; S.m.r-=5; S.rival.p-=10; }
  if(price>S.cash) return;
  S.cash-=price; oGain(id); S.offers=S.offers.filter(x=>x!==id); S.dealsLeft--;
  track("olig_deal",{asset:id,how}); for(const [k] of OM) S.m[k]=clamp(Math.round(S.m[k]),0,100);
  const L=oLvl(); if(L>S.lvl){ S.lvl=L; ochron(`Новый статус: ${OLV[L].n}`); S.forced.push(oLevelEv(L)); if(L===2&&S.rival.p===0){ S.rival.p=40; S.rival.as=Object.keys(OA).filter(x=>!oHas(x)&&OA[x].t>=1&&OA[x].t<=2).sort(()=>Math.random()-.5).slice(0,2);} }
  render();
}
function oSell(id){ const A=OA[id]; S.cash+=A.p*0.7; oLose(id); S.dealsLeft--; render(); }

      $("#roll").textContent=tr(show.n);
      if(n<steps) setTimeout(tick,40+n*n*0.9);
      else{ $("#rollsub").textContent=u("rollsub",fmtPop(S.c.pop),u("age",S.ruler.age)); setTimeout(()=>{S.phase="goal";render()},1300); }
    }; tick(); return;
  }
  const main=S.phase==="epi"?epiHTML():S.phase==="end"?endHTML():S.phase==="goal"?goalHTML():timelineHTML()+(S.fpUI?fpHTML():S.pgUI?progHTML():S.lfUI?lifeHTML():fpButton()+progButton()+lifeButton()+cardHTML());
  app.innerHTML=(MODE==="gov"?"":langBar())+dossierHTML()+gaugeHTML()+main+(MODE==="gov"?"":teamHTML())+`<p class="foot">${u("foot")}</p>`;
  bindLang();
  if(S.phase==="end"){
    const on=(id,f)=>{const b=document.getElementById(id); if(b) b.onclick=f;};
    on("again",newGame); on("menu",()=>{S=null;MODE="pres";render();scrollTo({top:0});}); on("next",nextTerm); on("succ",successor); on("transfer",transfer); on("share",shareCard); on("epiGo",()=>{S.epi=buildEpi(); S.epiI=0; S.phase="epi"; render(); scrollTo({top:0});});
    on("retire",()=>{S.why="retire";render();scrollTo({top:0});});
    on("rewrite",()=>{S.forever=true; S.m.p=clamp(S.m.p-12,1,100); S.m.l=clamp(S.m.l+8,0,CAP-3); nextTerm();});
    return; }
  if(S.phase==="epi"){ document.querySelectorAll(".epo").forEach(b=>b.onclick=()=>epiChoose(+b.dataset.i)); return; }
  if(S.phase==="goal"){ document.querySelectorAll(".opt.goal").forEach(b=>b.onclick=()=>setGoal(b.dataset.g)); return; }
  fpBind(); progBind(); lifeBind(); if(S.fpUI||S.pgUI||S.lfUI) return;
  document.querySelectorAll(".opt").forEach(b=>{
    const i=+b.dataset.i, eff=S.ev.o[i][1];
    const hl=on=>document.querySelectorAll(".g").forEach(g=>g.classList.toggle("hint",on&&!!eff[g.dataset.k]));
    b.onmouseenter=()=>hl(true); b.onfocus=()=>hl(true);
    b.onmouseleave=()=>hl(false); b.onblur=()=>hl(false);
    b.onclick=()=>choose(i);
  });
}
function bindLang(){ document.querySelectorAll(".lg").forEach(b=>b.onclick=()=>setLang(b.dataset.lang)); }

window.claude?.hot?.snapshot?.(()=>({S}));
const start=d=>{ if(d&&d.S&&d.S.ruler&&d.S.adv&&d.S.log&&(!d.S.log.length||d.S.log[0].ev)){S=d.S; MODE=S.mode||"pres"; S.reactAt=S.reactAt||{}; fpInit(); if(S.phase==="roll")S.phase="goal";} render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>

</body>
</html>
